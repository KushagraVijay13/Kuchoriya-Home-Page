/* ==========================================================================
   Kuchoriya TechSoft Redesign - Global Styles & Design System

:root {

  --color-light-bg: #FFFFFF;
  --color-light-surface: #F8F9FA;

  --radius-lg: 18px;

}

/* Base Resets */
*, *::before, *::after {
  box-sizing: border-box;

}

html {

/* Selection */

/* Container - Always centered on page */
.container {

/* Brand Accent & Gradients */
.text-orange {

}

.glass-dark {

}

}

/* Buttons */
.btn {

  gap: 0.5rem;

  font-size: 0.95rem;
  border-radius: var(--radius-md);

  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  text-decoration: none;
  border: none;
  outline: none;
}

.btn-primary {
  background: var(--color-orange-gradient);
  color: #FFFFFF;
  box-shadow: 0 4px 16px rgba(250, 84, 19, 0.4);
}

.btn-primary:hover {
  background: linear-gradient(135deg, #E04403 0%, #FA5413 100%);

}

.btn-secondary-light {

}

/* Smooth Tab Animations (Point 1 fix) */
@keyframes tabFadeIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.animate-tab-switch {
  animation: tabFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes pulseLive {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.4;
    transform: scale(0.85);
  }
}

.pulse-live {
  animation: pulseLive 2s ease-in-out infinite;
}

/* ==========================================================================
   Engineering Graphic Art Animations (Authentic Software Architecture)
   ========================================================================== */
@keyframes circuitFlow {
  from {
    stroke-dashoffset: 200;
  }
  to {
    stroke-dashoffset: 0;
  }
}

.circuit-flow-line {
  stroke-dasharray: 8 14;
  animation: circuitFlow 14s linear infinite;
  opacity: 0.65;
}

.circuit-flow-fast {
  stroke-dasharray: 6 12;
  animation: circuitFlow 8s linear infinite;
  opacity: 0.65;
}

@keyframes nodeGlow {
  0%, 100% {
    r: 3;
    opacity: 0.4;
  }
  50% {
    r: 4.5;
    opacity: 0.75;
    filter: drop-shadow(0 0 4px #FA5413);
  }
}

.pulsing-circuit-node {
  animation: nodeGlow 3s ease-in-out infinite;
}

@keyframes floatDiagram {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}

.float-diagram {
  animation: floatDiagram 6s ease-in-out infinite;
}

/* Ticker Animations */
@keyframes tickerSlide {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.ticker-track {
  display: flex;
  width: max-content;
  animation: tickerSlide 35s linear infinite;
}

.ticker-track:hover {
  animation-play-state: paused;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: #0B0F17;
}

::-webkit-scrollbar-thumb {
  background: #232D3F;
  border-radius: 4px;

/* Focus styles for accessibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
