  from {

}

  50% {

d:"faq-timeline",category:"Timeline & Delivery",question:"How long does mobile app development take?",answer:"A standard custom mobile application typically takes between 3 to 6 months from discovery to app store deployment. Initial wireframing and interactive UI/UX prototyping take 2 to 4 weeks, followed by iterative 2-week agile development sprints (8 to 14 weeks), and dedicated QA, security auditing, and app store approval (2 to 3 weeks). Simpler MVP apps can be delivered in as little as 6 to 8 weeks."},{id:"faq-platforms",category:"Mobile Development",question:"Can Kuchoriya develop Android and iOS applications?",answer:"Yes. We build native iOS applications using Swift and native Android applications using Kotlin for maximum hardware performance and platform-specific design fidelity. In addition, we specialize in modern cross-platform frameworks including Flutter and React Native, which allow clients to launch on both iOS and Android simultaneously with a unified codebase, reducing engineering costs by up to 40% while preserving 60fps native feel."},{id:"faq-ai",category:"Artificial Intelligence",question:"Does Kuchoriya offer AI and AI agent development?",answer:"Yes, Kuchoriya TechSoft possesses a dedicated Artificial Intelligence and Autonomous Agent engineering practice. We develop custom Generative AI solutions, Retrieval-Augmented Generation (RAG) knowledge retrieval engines over enterprise data, autonomous multi-agent systems (using LangGraph, CrewAI, and AutoGPT), intelligent process automation bots, and predictive machine learning models with stringent privacy and data governance."},{id:"faq-process",category:"Engineering Methodology",question:"What is the software development process?",answer:"We follow a battle-tested 6-stage Agile project lifecycle: (1) Discovery & Technical Scope Analysis, (2) Strategy & Architecture Planning, (3) UI/UX Design & Clickable Prototyping, (4) Iterative Agile Development Sprints with bi-weekly client demos, (5) Rigorous QA & Multi-Device Automated Testing, and (6) Deployment, App Store Launch, and SLA Support. You receive direct access to our project management board (Jira/Linear) and daily communication channels (Slack/Teams)."},{id:"faq-support",category:"Support & Maintenance",question:"Does Kuchoriya provide post-launch support?",answer:"Absolutely. Every project includes complimentary post-launch warranty support (typically 30 to 90 days) to address any emergent edge cases. Beyond launch, we offer structured Service Level Agreements (SLAs), including 24/7 server monitoring, OS security patches, database optimizations, third-party API updates, and continuous feature development roadmaps."}];var he=z(H(),1),ug=({onOpenConsultation:e})=>{let[a,t]=(0,ng.useState)([Es[0].id]),l=o=>{a.includes(o)?t(a.filter(i=>i!==o)):t([...a,o])};return(0,he.jsxs)("section",{id:"faq",style:{backgroundColor:"#0B0F17",color:"#FFFFFF",paddingTop:"clamp(4rem, 8vw, 6.5rem)",paddingBottom:"clamp(4rem, 8vw, 6.5rem)",position:"relative",borderTop:"1px solid rgba(255, 255, 255, 0.08)",overflow:"hidden"},children:[(0,he.jsx)(ue,{variant:"dark",sectionCode:"SEC.11/FAQ",title:"ENTERPRISE_KNOWLEDGE_BASE"}),(0,he.jsxs)("div",{className:"container",style:{maxWidth:"960px",position:"relative",zIndex:10},children:[(0,he.jsxs)("div",{style:{textAlign:"center",marginBottom:"3.5rem"},children:[(0,he.jsx)("div",{style:{display:"inline-flex",alignItems:"center",gap:"0.5rem",backgroundColor:"rgba(250, 84, 19, 0.1)",color:"#FF8C38",borderRadius:"9999px",padding:"0.35rem 0.95rem",fontSize:"0.82rem",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"1rem",border:"1px solid rgba(250, 84, 19, 0.25)"},children:"Clear Answers"}),(0,he.jsxs)("h2",{className:"heading-section",style:{color:"#FFFFFF",marginBottom:"1.25rem"},children:["Frequently Asked ",(0,he.jsx)("span",{style:{color:"#FA5413"},children:"Questions"})]}),(0,he.jsx)("p",{style:{fontSize:"1.1rem",color:"#94A3B8",lineHeight:1.6},children:"T
